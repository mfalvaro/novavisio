<!-- templates/registration/login.html -->
{% extends 'base.html' %}

{% block title %}eLab Login{% endblock %}

{% block content1 %}
	<h1>Criar conta</h1>
	<form method="post">
		{% csrf_token %}
		{{ form.as_p }}
		<button type="submit">Cadastrar</button>
	</form>
    </br>
	<p>Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
	<p>Voltar para <a href="{% url 'home_eLab' %}">Home</a></p>

{% endblock %}
